              void captureAndShare() {

                  try {

                      View v =
                              getWindow()
                                      .getDecorView();

                      Bitmap b =
                              Bitmap.createBitmap(
                                      v.getWidth(),
                                      v.getHeight(),
                                      Bitmap.Config.ARGB_8888
                              );

                      Canvas c =
                              new Canvas(b);

                      v.draw(c);

                      File dir =
                              new File(
                                      getCacheDir(),
                                      "shared"
                              );

                      if (!dir.exists())
                          dir.mkdirs();

                      File f =
                              new File(
                                      dir,
                                      "bluecalc_"
                                      + System.currentTimeMillis()
                                      + ".png"
                              );

                      FileOutputStream out =
                              new FileOutputStream(f);

                      b.compress(
                              Bitmap.CompressFormat.PNG,
                              100,
                              out
                      );

                      out.close();

                      Uri uri =
                              FileProvider.getUriForFile(
                                      this,
                                      getPackageName()
                                              + ".fileprovider",
                                      f
                              );

                      Intent i =
                              new Intent(
                                      Intent.ACTION_SEND
                              );

                      i.setType("image/png");

                      i.putExtra(
                              Intent.EXTRA_STREAM,
                              uri
                      );

                      i.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                      );

                      startActivity(
                              Intent.createChooser(
                                      i,
                                      tamil
                                              ? "Screenshot பகிர்"
                                              : "Share screenshot"
                              )
                      );

                  } catch (Exception e) {

                      shareText(
                              display.getText().toString()
                      );
                  }
              }

              void settings() {

                  String[] items = {
                          tamil
                                  ? "English"
                                  : "தமிழ்",

                          dark
                                  ? "Light theme"
                                  : "Dark theme",

                          "Wallpaper / background image",

                          "Clear history"
                  };

                  new AlertDialog.Builder(this)
                          .setTitle(
                                  tamil
                                          ? "அமைப்புகள்"
                                          : "Settings"
                          )
                          .setItems(
                                  items,
                                  (dialog,which) -> {

                                      if (which == 0) {

                                          tamil = !tamil;

                                          prefs.edit()
                                                  .putBoolean(
                                                          "tamil",
                                                          tamil
                                                  )
                                                  .apply();

                                          build();

                                      } else if (which == 1) {

                                          dark = !dark;

                                          prefs.edit()
                                                  .putBoolean(
                                                          "dark",
                                                          dark
                                                  )
                                                  .apply();

                                          build();

                                      } else if (which == 2) {

                                          Intent i =
                                                  new Intent(
                                                          Intent.ACTION_OPEN_DOCUMENT
                                                  );

                                          i.setType(
                                                  "image/*"
                                          );

                                          i.addCategory(
                                                  Intent.CATEGORY_OPENABLE
                                          );

                                          startActivityForResult(
                                                  i,
                                                  44
                                          );

                                      } else {

                                          history.clear();

                                          historyDialog();
                                      }
                                  }
                          )
                          .show();
              }

              void restoreWallpaper() {

                  String raw =
                          prefs.getString(
                                  "wallpaper",
                                  ""
                          );

                  if (raw.isEmpty())
                      return;

                  try {

                      Uri u =
                              Uri.parse(raw);

                      InputStream in =
                              getContentResolver()
                                      .openInputStream(u);

                      Drawable d =
                              Drawable.createFromStream(
                                      in,
                                      "wallpaper"
                              );

                      if (in != null)
                          in.close();

                      if (d != null)
                          root.setBackground(d);

                  } catch (Exception ignored) {
                  }
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data
              ) {

                  super.onActivityResult(
                          request,
                          result,
                          data
                  );

                  if (
                          request == 44
                          && result == RESULT_OK
                          && data != null
                  ) {

                      try {

                          getContentResolver()
                                  .takePersistableUriPermission(
                                          data.getData(),
                                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                                  );

                          prefs.edit()
                                  .putString(
                                          "wallpaper",
                                          data.getData()
                                                  .toString()
                                  )
                                  .apply();

                          Toast.makeText(
                                  this,
                                  tamil
                                          ? "பின்னணி சேமிக்கப்பட்டது"
                                          : "Wallpaper selected",
                                  Toast.LENGTH_SHORT
                          ).show();

                          build();

                      } catch (Exception e) {
                      }
                  }
              }
          }
