              void currency(
                      LinearLayout box,
                      Dialog d
              ) {

                  EditText amount =
                          input("Amount in USD");

                  EditText target =
                          input(
                                  "Target currency e.g. INR"
                          );

                  target.setText("INR");

                  box.addView(
                          amount,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );

                  box.addView(
                          target,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );

                  Button go =
                          button(
                                  "Get live exchange rate"
                          );

                  TextView out =
                          text(
                                  "Internet required for live rates.",
                                  14,
                                  MUTED
                          );

                  box.addView(
                          go,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );

                  box.addView(out);

                  go.setOnClickListener(v -> {

                      try {

                          double a =
                                  Double.parseDouble(
                                          amount.getText()
                                                  .toString()
                                  );

                          String code =
                                  target.getText()
                                          .toString()
                                          .trim()
                                          .toUpperCase(
                                                  Locale.US
                                          );

                          out.setText("Loading...");

                          new Thread(() -> {

                              try {

                                  URL u =
                                          new URL(
                                                  "https://open.er-api.com/v6/latest/USD"
                                          );

                                  HttpURLConnection c =
                                          (HttpURLConnection)
                                                  u.openConnection();

                                  c.setConnectTimeout(7000);
                                  c.setReadTimeout(7000);

                                  BufferedReader br =
                                          new BufferedReader(
                                                  new InputStreamReader(
                                                          c.getInputStream()
                                                  )
                                          );

                                  StringBuilder s =
                                          new StringBuilder();

                                  String line;

                                  while (
                                          (line = br.readLine())
                                          != null
                                  ) {
                                      s.append(line);
                                  }

                                  br.close();

                                  JSONObject j =
                                          new JSONObject(
                                                  s.toString()
                                          );

                                  double rate =
                                          j.getJSONObject(
                                                  "rates"
                                          ).getDouble(code);

                                  runOnUiThread(
                                          () ->
                                                  out.setText(
                                                          fmt(
                                                                  a * rate
                                                          )
                                                          + " "
                                                          + code
                                                          + " • live rate"
                                                  )
                                  );

                              } catch (Exception ex) {

                                  runOnUiThread(
                                          () ->
                                                  out.setText(
                                                          "Live rate unavailable. Check code/internet."
                                                  )
                                  );
                              }

                          }).start();

                      } catch (Exception ex) {

                          out.setText(
                                  "Enter a valid amount"
                          );
                      }
                  });

                  closeOnly(box,d);
              }

