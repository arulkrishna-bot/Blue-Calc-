name: Build BlueCalc Premium APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create complete Android project
        shell: bash
        run: |
          set -e
          mkdir -p BlueCalc/app/src/main/java/com/arulkrishna/bluecalc
          mkdir -p BlueCalc/app/src/main/res/values
          mkdir -p BlueCalc/app/src/main/res/xml
          cd BlueCalc

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BlueCalc"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.arulkrishna.bluecalc'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.arulkrishna.bluecalc'
                  minSdk 23
                  targetSdk 35
                  versionCode 40
                  versionName '4.0'
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="blue">#4EA1FF</color>
              <color name="navy">#07111F</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:colorAccent">#4EA1FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="BlueCalc"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">

                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />

                  </provider>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared" path="shared/" />
          </paths>
          EOF

          cat > app/src/main/java/com/arulkrishna/bluecalc/MainActivity.java <<'EOF'
          package com.arulkrishna.bluecalc;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import android.view.*;
          import android.view.animation.DecelerateInterpolator;
          import android.widget.*;

          import java.io.*;
          import java.net.*;
          import java.text.*;
          import java.util.*;

          import org.json.*;

          public class MainActivity extends Activity {

              static final int BG = Color.rgb(7,17,31);
              static final int PANEL = Color.rgb(13,27,42);
              static final int CARD = Color.rgb(18,38,59);
              static final int BLUE = Color.rgb(78,161,255);
              static final int WHITE = Color.rgb(247,250,255);
              static final int MUTED = Color.rgb(156,176,199);

              LinearLayout root, content, calcPage, convPage;

              TextView display;
              TextView historyLine;
              TextView clock;
              TextView tagline;

              String expr = "";

              boolean tamil = true;
              boolean converter = false;
              boolean dark = true;

              float downX;

              ArrayList<String> history = new ArrayList<>();

              SharedPreferences prefs;

              int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + .5f);
              }

              TextView text(String s, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              GradientDrawable rounded(int c, float r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(c);
                  g.setCornerRadius(dp(r));
                  return g;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(17);
                  b.setTextColor(WHITE);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setPadding(0,0,0,0);
                  b.setBackground(rounded(CARD,18));
                  return b;
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  prefs = getSharedPreferences("bluecalc", MODE_PRIVATE);

                  tamil = prefs.getBoolean("tamil", true);
                  dark = prefs.getBoolean("dark", true);

                  build();
                  updateClock();

                  new Handler().postDelayed(new Runnable() {
                      public void run() {
                          updateClock();
                          new Handler().postDelayed(this, 1000);
                      }
                  }, 1000);
              }

              void build() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(7), dp(14), dp(10));

                  root.setBackgroundColor(
                          dark ? BG : Color.rgb(244,247,251)
                  );

                  setContentView(root);

                  restoreWallpaper();

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);

                  clock = text("", 13, dark ? MUTED : Color.DKGRAY);

                  top.addView(
                          clock,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1
                          )
                  );

                  Button set = button("⚙");
                  set.setTextSize(24);

                  top.addView(
                          set,
                          new LinearLayout.LayoutParams(
                                  dp(48),
                                  dp(48)
                          )
                  );

                  set.setOnClickListener(v -> settings());

                  root.addView(top);

                  LinearLayout tabs = new LinearLayout(this);

                  tabs.setPadding(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3)
                  );

                  tabs.setBackground(
                          rounded(
                                  dark
                                          ? PANEL
                                          : Color.rgb(225,232,241),
                                  22
                          )
                  );

                  Button cb = button(
                          tamil ? "கணிப்பான்" : "Calculator"
                  );

                  Button vb = button(
                          tamil ? "மாற்றி" : "Converter"
                  );

                  tabs.addView(
                          cb,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  tabs.addView(
                          vb,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  cb.setOnClickListener(v -> showPage(false));
                  vb.setOnClickListener(v -> showPage(true));

                  root.addView(tabs);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);

                  root.addView(
                          content,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  buildCalculator();
                  buildConverter();

                  showPage(false);

                  content.setOnTouchListener((v,e) -> {

                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          downX = e.getX();
                      }

                      if (e.getAction() == MotionEvent.ACTION_UP) {

                          float dx = e.getX() - downX;

                          if (Math.abs(dx) > dp(65)) {
                              showPage(dx < 0);
                              return true;
                          }
                      }

                      return true;
                  });
              }

              void buildCalculator() {

                  calcPage = new LinearLayout(this);
                  calcPage.setOrientation(LinearLayout.VERTICAL);

                  tagline = text(
                          "சரியான கணக்கீடு\nசிறப்பான முடிவு தரும்",
                          14,
                          BLUE
                  );

                  tagline.setGravity(Gravity.CENTER);
                  tagline.setTypeface(null, 1);

                  calcPage.addView(
                          tagline,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(60)
                          )
                  );

                  LinearLayout displayCard = new LinearLayout(this);

                  displayCard.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  displayCard.setGravity(
                          Gravity.BOTTOM | Gravity.RIGHT
                  );

                  displayCard.setPadding(
                          dp(16),
                          dp(10),
                          dp(16),
                          dp(8)
                  );

                  displayCard.setBackground(
                          rounded(
                                  dark ? PANEL : Color.WHITE,
                                  22
                          )
                  );

                  historyLine = text(
                          "",
                          13,
                          dark ? MUTED : Color.DKGRAY
                  );

                  historyLine.setGravity(Gravity.RIGHT);

                  display = text(
                          "0",
                          39,
                          dark
                                  ? WHITE
                                  : Color.rgb(20,30,40)
                  );

                  display.setGravity(Gravity.RIGHT);
                  display.setTypeface(null, 1);

                  displayCard.addView(
                          historyLine,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(24)
                          )
                  );

                  displayCard.addView(
                          display,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(70)
                          )
                  );

                  calcPage.addView(
                          displayCard,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(104)
                          )
                  );

                  GridLayout keys = new GridLayout(this);

                  keys.setColumnCount(4);
                  keys.setRowCount(6);

                  String[] labels = {
                          "AC","⌫","%","÷",
                          "7","8","9","×",
                          "4","5","6","−",
                          "1","2","3","+",
                          "0",".","(",")",
                          "±","=","",""
                  };

                  for (String s : labels) {

                      if (s.isEmpty()) continue;

                      Button b = button(s);

                      b.setTextSize(
                              s.equals("=") ? 23 : 18
                      );

                      if (s.equals("=")) {
                          b.setBackground(
                                  rounded(BLUE,18)
                          );
                      }

                      b.setOnClickListener(
                              v -> press(
                                      ((Button)v)
                                              .getText()
                                              .toString()
                              )
                      );

                      GridLayout.LayoutParams p =
                              new GridLayout.LayoutParams();

                      p.width = 0;
                      p.height = 0;

                      p.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );

                      p.rowSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );

                      p.setMargins(
                              dp(3),
                              dp(3),
                              dp(3),
                              dp(3)
                      );

                      keys.addView(b,p);
                  }

                  calcPage.addView(
                          keys,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  LinearLayout tools =
                          new LinearLayout(this);

                  addTool(
                          tools,
                          tamil ? "வரலாறு" : "History",
                          v -> historyDialog()
                  );

                  addTool(
                          tools,
                          tamil ? "படம்" : "Screenshot",
                          v -> captureAndShare()
                  );

                  addTool(
                          tools,
                          tamil ? "பகிர்" : "Share",
                          v -> shareText(
                                  display.getText().toString()
                          )
                  );

                  calcPage.addView(
                          tools,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(46)
                          )
                  );

                  content.addView(
                          calcPage,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );
              }

              void addTool(
                      LinearLayout row,
                      String label,
                      View.OnClickListener l
              ) {

                  Button b = button(label);

                  b.setTextSize(12);
                  b.setOnClickListener(l);

                  row.addView(
                          b,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(44),
                                  1
                          )
                  );
              }

              void press(String k) {

                  if (k.equals("AC")) {
                      expr = "";
                      display.setText("0");
                      historyLine.setText("");
                      return;
                  }

                  if (k.equals("⌫")) {

                      if (expr.length() > 0) {
                          expr =
                                  expr.substring(
                                          0,
                                          expr.length()-1
                                  );
                      }

                      display.setText(
                              expr.length() == 0
                                      ? "0"
                                      : expr
                      );

                      return;
                  }

                  if (k.equals("±")) {

                      if (!expr.isEmpty()) {
                          if (expr.startsWith("-")) {
                              expr = expr.substring(1);
                          } else {
                              expr = "-" + expr;
                          }
                          display.setText(expr);
                      }

                      return;
                  }

                  if (k.equals("=")) {

                      try {

                          double r = eval(expr);

                          String out = fmt(r);

                          history.add(
                                  expr + " = " + out
                          );

                          historyLine.setText(expr);
                          display.setText(out);

                          expr = out;

                      } catch (Exception e) {

                          display.setText("Error");
                          expr = "";
                      }

                      return;
                  }

                  String x =
                          k.replace("×","*")
                           .replace("÷","/")
                           .replace("−","-");

                  if (k.equals("%")) {
                      x = "/100";
                  }

                  expr += x;

                  display.setText(expr);
              }

              double eval(String s) {

                  final String z =
                          s.replaceAll("\\s+","");

                  return new Object() {

                      int p = -1;
                      int ch;

                      void next() {
                          ch =
                                  ++p < z.length()
                                          ? z.charAt(p)
                                          : -1;
                      }

                      boolean eat(int c) {

                          while (ch == ' ') next();

                          if (ch == c) {
                              next();
                              return true;
                          }

                          return false;
                      }

                      double parse() {

                          next();

                          double x = expression();

                          if (p < z.length())
                              throw new RuntimeException();

                          return x;
                      }

                      double expression() {

                          double x = term();

                          for (;;) {

                              if (eat('+'))
                                  x += term();

                              else if (eat('-'))
                                  x -= term();

                              else
                                  return x;
                          }
                      }

                      double term() {

                          double x = factor();

                          for (;;) {

                              if (eat('*'))
                                  x *= factor();

                              else if (eat('/'))
                                  x /= factor();

                              else
                                  return x;
                          }
                      }

                      double factor() {

                          if (eat('+'))
                              return factor();

                          if (eat('-'))
                              return -factor();

                          double x;

                          int start = p;

                          if (eat('(')) {

                              x = expression();

                              if (!eat(')'))
                                  throw new RuntimeException();

                          } else {

                              while (
                                      (ch >= '0' && ch <= '9')
                                      || ch == '.'
                              ) {
                                  next();
                              }

                              if (start == p)
                                  throw new RuntimeException();

                              x = Double.parseDouble(
                                      z.substring(start,p)
                              );
                          }

                          return x;
                      }

                  }.parse();
              }

              String fmt(double x) {

                  if (
                          Double.isNaN(x)
                          || Double.isInfinite(x)
                  )
                      throw new RuntimeException();

                  if (
                          Math.abs(
                                  x - Math.rint(x)
                          ) < 1e-10
                  ) {
                      return String.format(
                              Locale.US,
                              "%.0f",
                              x
                      );
                  }

                  return String.format(
                          Locale.US,
                          "%.10f",
                          x
                  )
                  .replaceAll("0+$","")
                  .replaceAll("\\.$","");
              }

              void buildConverter() {

                  convPage =
                          new LinearLayout(this);

                  convPage.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView h = text(
                          tamil
                                  ? "மாற்றிகள்"
                                  : "Converters",
                          24,
                          dark
                                  ? WHITE
                                  : Color.rgb(20,30,40)
                  );

                  h.setTypeface(null,1);

                  convPage.addView(
                          h,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );

                  ScrollView sv = new ScrollView(this);

                  LinearLayout list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  String[] cats = {
                          "Currency",
                          "Length",
                          "Mass",
                          "Area",
                          "Time",
                          "Finance",
                          "Data",
                          "Date",
                          "Discount",
                          "Volume",
                          "Numeral system",
                          "Speed",
                          "Temperature",
                          "GST",
                          "BMI"
                  };

                  for (String c : cats) {

                      Button b = button(c);

                      b.setTextSize(15);

                      b.setGravity(
                              Gravity.LEFT
                              | Gravity.CENTER_VERTICAL
                      );

                      b.setPadding(
                              dp(18),
                              0,
                              0,
                              0
                      );

                      b.setOnClickListener(
                              v -> openConverter(
                                      ((Button)v)
                                              .getText()
                                              .toString()
                              )
                      );

                      list.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(50)
                              )
                      );
                  }

                  sv.addView(list);

                  convPage.addView(
                          sv,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  content.addView(
                          convPage,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );
              }

              EditText input(String hint) {

                  EditText e = new EditText(this);

                  e.setHint(hint);

                  e.setTextColor(
                          dark ? WHITE : Color.DKGRAY
                  );

                  e.setHintTextColor(MUTED);

                  e.setInputType(
                          2 | 8192
                  );

                  e.setSingleLine(true);

                  e.setPadding(
                          dp(12),
                          0,
                          dp(12),
                          0
                  );

                  e.setBackground(
                          rounded(
                                  dark
                                          ? CARD
                                          : Color.rgb(
                                                  232,
                                                  237,
                                                  244
                                          ),
                                  14
                          )
                  );

                  return e;
              }

              void openConverter(String type) {

                  final Dialog d = new Dialog(this);

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(18),
                          dp(16),
                          dp(18),
                          dp(16)
                  );

                  box.setBackground(
                          rounded(
                                  dark ? PANEL : Color.WHITE,
                                  24
                          )
                  );

                  TextView title = text(
                          type,
                          21,
                          dark
                                  ? WHITE
                                  : Color.DKGRAY
                  );

                  title.setTypeface(null,1);

                  box.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(45)
                          )
                  );

                  if (type.equals("Currency"))
                      currency(box,d);

                  else if (type.equals("Length"))
                      pair(
                              box,
                              d,
                              "Meter",
                              "Feet",
                              x -> x * 3.280839895,
                              x -> x / 3.280839895
                      );

                  else if (type.equals("Mass"))
                      pair(
                              box,
                              d,
                              "Kilogram",
                              "Pound",
                              x -> x * 2.2046226218,
                              x -> x / 2.2046226218
                      );

                  else if (type.equals("Area"))
                      pair(
                              box,
                              d,
                              "Square meter",
                              "Square foot",
                              x -> x * 10.763910417,
                              x -> x / 10.763910417
                      );

                  else if (type.equals("Time"))
                      pair(
                              box,
                              d,
                              "Hours",
                              "Minutes",
                              x -> x * 60,
                              x -> x / 60
                      );

                  else if (type.equals("Data"))
                      pair(
                              box,
                              d,
                              "MB",
                              "GB",
                              x -> x / 1024,
                              x -> x * 1024
                      );

                  else if (type.equals("Volume"))
                      pair(
                              box,
                              d,
                              "Liter",
                              "US gallon",
                              x -> x * 0.2641720524,
                              x -> x / 0.2641720524
                      );

                  else if (type.equals("Speed"))
                      pair(
                              box,
                              d,
                              "km/h",
                              "mph",
                              x -> x * 0.6213711922,
                              x -> x / 0.6213711922
                      );

                  else if (type.equals("Temperature"))
                      pair(
                              box,
                              d,
                              "Celsius",
                              "Fahrenheit",
                              x -> x * 9 / 5 + 32,
                              x -> (x - 32) * 5 / 9
                      );

                  else if (type.equals("Discount"))
                      two(
                              box,
                              d,
                              "Price",
                              "Discount %",
                              (a,b) -> a * (1 - b / 100),
                              "Final price"
                      );

                  else if (type.equals("GST"))
                      two(
                              box,
                              d,
                              "Amount",
                              "GST %",
                              (a,b) -> a * (1 + b / 100),
                              "Total"
                      );

                  else if (type.equals("BMI"))
                      two(
                              box,
                              d,
                              "Weight kg",
                              "Height m",
                              (a,b) -> a / (b*b),
                              "BMI"
                      );

                  else if (type.equals("Finance"))
                      finance(box,d);

                  else if (type.equals("Date"))
                      dateTools(box,d);

                  else if (type.equals("Numeral system"))
                      numeral(box,d);

                  else
                      closeOnly(box,d);

                  d.setContentView(box);

                  Window w = d.getWindow();

                  if (w != null) {

                      w.setBackgroundDrawable(
                              new ColorDrawable(
                                      Color.TRANSPARENT
                              )
                      );

                      WindowManager.LayoutParams p =
                              new WindowManager.LayoutParams();

                      p.copyFrom(w.getAttributes());

                      p.width =
                              (int)(
                                      getResources()
                                              .getDisplayMetrics()
                                              .widthPixels
                                      * .92
                              );

                      w.setAttributes(p);
                  }

                  d.show();
              }

              interface F {
                  double f(double x);
              }

              interface F2 {
                  double f(double a,double b);
              }

              void pair(
                      LinearLayout box,
                      Dialog d,
                      String a,
                      String b,
                      F f,
                      F reverse
              ) {

                  EditText e =
                          input(a + " value");

                  box.addView(
                          e,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
