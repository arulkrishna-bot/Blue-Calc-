              String taNum(String s) {

                  char[] map = {
                          '௦','௧','௨','௩','௪',
                          '௫','௬','௭','௮','௯'
                  };

                  StringBuilder b =
                          new StringBuilder();

                  for (int i=0;i<s.length();i++) {

                      char ch = s.charAt(i);

                      if (
                              ch >= '0'
                              && ch <= '9'
                      ) {
                          b.append(
                                  map[ch-'0']
                          );
                      } else {
                          b.append(ch);
                      }
                  }

                  return b.toString();
              }

              void updateClock() {

                  if (clock == null)
                      return;

                  Calendar c =
                          Calendar.getInstance();

                  String[] months =
                          tamil
                                  ? new String[]{
                                      "ஜனவரி",
                                      "பிப்ரவரி",
                                      "மார்ச்",
                                      "ஏப்ரல்",
                                      "மே",
                                      "ஜூன்",
                                      "ஜூலை",
                                      "ஆகஸ்ட்",
                                      "செப்டம்பர்",
                                      "அக்டோபர்",
                                      "நவம்பர்",
                                      "டிசம்பர்"
                                    }
                                  : new String[]{
                                      "January",
                                      "February",
                                      "March",
                                      "April",
                                      "May",
                                      "June",
                                      "July",
                                      "August",
                                      "September",
                                      "October",
                                      "November",
                                      "December"
                                    };

                  String[] days =
                          tamil
                                  ? new String[]{
                                      "ஞாயிற்றுக்கிழமை",
                                      "திங்கட்கிழமை",
                                      "செவ்வாய்க்கிழமை",
                                      "புதன்கிழமை",
                                      "வியாழக்கிழமை",
                                      "வெள்ளிக்கிழமை",
                                      "சனிக்கிழமை"
                                    }
                                  : new String[]{
                                      "Sunday",
                                      "Monday",
                                      "Tuesday",
                                      "Wednesday",
                                      "Thursday",
                                      "Friday",
                                      "Saturday"
                                    };

                  String rawTime =
                          new SimpleDateFormat(
                                  "hh:mm:ss",
                                  Locale.US
                          ).format(
                                  c.getTime()
                          );

                  String ap =
                          new SimpleDateFormat(
                                  "a",
                                  Locale.US
                          ).format(
                                  c.getTime()
                          );

                  if (tamil) {
                      ap =
                              ap.equals("AM")
                                      ? "முற்பகல்"
                                      : "பிற்பகல்";
                  }

                  String s =
                          days[
                                  c.get(
                                          Calendar.DAY_OF_WEEK
                                  ) - 1
                          ]
                          + " • "
                          + (
                                  tamil
                                          ? taNum(
                                                  String.valueOf(
                                                          c.get(
                                                                  Calendar.DAY_OF_MONTH
                                                          )
                                                  )
                                            )
                                          : String.valueOf(
                                                  c.get(
                                                          Calendar.DAY_OF_MONTH
                                                  )
                                            )
                            )
                          + " "
                          + months[
                                  c.get(Calendar.MONTH)
                            ]
                          + " "
                          + (
                                  tamil
                                          ? taNum(
                                                  String.valueOf(
                                                          c.get(
                                                                  Calendar.YEAR
                                                          )
                                                  )
                                            )
                                          : String.valueOf(
                                                  c.get(
                                                          Calendar.YEAR
                                                  )
                                            )
                            )
                          + "\n"
                          + (
                                  tamil
                                          ? taNum(rawTime)
                                          : rawTime
                            )
                          + " "
                          + ap;

                  clock.setText(s);
              }

